[project]
name = "i26-connector-3d"
version = "0.1.0"
description = "Builds the I-26 Connector 3D drive-through viewer (single HTML file) from NCDOT plans and public data"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy==2.5.3",
  "scipy==1.18.1",
  "shapely==2.2.0",
  "matplotlib==3.11.2",
  "pillow==12.3.0",
  "pyarrow==26.0.1",
  "pyproj==3.8.0",
  "rasterio==1.5.2",
  "triangle==20250106",
  "pymupdf==2.1",
  "lxml",
  "networkx==3.7",
]

[tool.uv]
package = false
